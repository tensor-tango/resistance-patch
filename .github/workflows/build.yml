name: Build PPSSPP PRX

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PSP toolchain
        run: |
          psp-gcc --version
          psp-config --pspsdk-path

      - name: Build plugin
        run: |
          make clean || true
          make

      - name: Package artifact
        run: |
          mkdir -p output/resistance_remastered
          cp resistance_remastered.prx output/resistance_remastered/
          cp plugin.ini output/resistance_remastered/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: resistance_remastered_ppsspp
          path: output/resistance_remastered/
